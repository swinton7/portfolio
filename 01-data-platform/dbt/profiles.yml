data_platform:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: /tmp/warehouse.duckdb
      extensions: [httpfs, parquet]
      settings:
        s3_endpoint: "{{ env_var('S3_ENDPOINT') }}"
        s3_access_key_id: "{{ env_var('S3_ACCESS_KEY') }}"
        s3_secret_access_key: "{{ env_var('S3_SECRET_KEY') }}"
        s3_use_ssl: false
        s3_url_style: path
        s3_region: us-east-1
