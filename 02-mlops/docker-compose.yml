x-mlflow-env: &mlflow-env
  MLFLOW_TRACKING_URI: http://mlflow:5000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mlflow"]
      interval: 3s
      retries: 20

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9101:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 20

  create-bucket:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    entrypoint: ["sh", "-c", "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb -p local/mlflow"]
    depends_on:
      minio:
        condition: service_healthy

  mlflow:
    build: .
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://mlflow:mlflow@postgres/mlflow
      --artifacts-destination s3://mlflow
      --allowed-hosts "*"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "5050:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 3s
      retries: 40
    depends_on:
      postgres:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

  train:
    build: .
    command: python train.py
    environment: *mlflow-env
    depends_on:
      mlflow:
        condition: service_healthy

  serve:
    build: .
    command: mlflow models serve -m models:/fraud-detector@champion --host 0.0.0.0 --port 5001 --env-manager local
    environment: *mlflow-env
    ports:
      - "5051:5001"
    depends_on:
      train:
        condition: service_completed_successfully
